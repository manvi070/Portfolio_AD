<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching site theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DB5FF" />
      <stop offset="50%" stop-color="#5892FF" />
      <stop offset="100%" stop-color="#346AE8" />
    </linearGradient>
    
    <!-- Glossy Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow for Monogram -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0A2463" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" />

  <!-- Glossy Reflection -->
  <path d="M 16 136 C 16 70 70 16 136 16 L 376 16 C 442 16 496 70 496 136 C 496 220 380 270 256 270 C 132 270 16 220 16 136 Z" fill="url(#glossGrad)" />

  <!-- Monogram MG -->
  <g filter="url(#dropShadow)">
    <text x="256" y="325" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Geist', sans-serif" 
          font-weight="900" 
          font-size="210" 
          letter-spacing="-8" 
          fill="#FFFFFF" 
          text-anchor="middle">MG</text>
  </g>
</svg>
